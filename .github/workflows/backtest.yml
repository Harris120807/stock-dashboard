name: Score backtest

# Owner-triggered from the admin console (Backtest tab). Recomputes the
# quintile forward-return analysis from the stored 5y history shards and
# commits backtest.json to claude/state, where the admin page reads it.
# Rough sanity check by design — see the caveats in scripts/backtest.py.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard-state
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/state
          path: state

      - name: Run quintile backtest
        run: |
          STATE_DIR=state python3 state/scripts/backtest.py

      - name: Push results
        run: |
          cd state
          git config user.email "pipeline@claude.local"
          git config user.name "Stock Dashboard Pipeline"
          git add backtest.json
          git diff --cached --quiet && exit 0
          git commit -q -m "backtest: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin claude/state || { git pull --rebase origin claude/state && git push origin claude/state; }
