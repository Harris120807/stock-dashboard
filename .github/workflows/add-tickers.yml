name: Add tickers to universe

# Owner-initiated additions from the admin dashboard (valuetally.com/admin).
# Dispatched by the Cloudflare Worker's /admin/add-tickers route (ADMIN_KEY-
# gated) with the raw form input. Validates each entry, appends accepted ones
# to the append-only pool, backfills their full 5y history, then kicks an
# hourly refresh so the new stocks are live minutes after submission.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma/space-separated: SYMBOL (US-listed) or NATIVE:ADR (European, e.g. HSBA.L:HSBC)"
        type: string
        required: true

permissions:
  contents: write
  actions: write   # chains a hourly-refresh dispatch after a successful add

concurrency:
  group: dashboard-state
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/state
          path: state

      - name: Validate and append to universe
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          STATE_DIR=state OUT_DIR=out python3 state/scripts/add_tickers.py

      - name: Backfill 5y history for the new tickers
        run: |
          DEEPEN=1 STATE_DIR=state python3 state/scripts/backfill_history.py

      - name: Push universe + history
        id: push
        run: |
          cd state
          git config user.email "pipeline@claude.local"
          git config user.name "Stock Dashboard Pipeline"
          git add universe.json history
          if git diff --cached --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "universe: owner add via admin $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin claude/state || { git pull --rebase origin claude/state && git push origin claude/state; }
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh the dashboard with the new tickers
        if: steps.push.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run hourly-refresh.yml --ref main -R "$GITHUB_REPOSITORY"

      - name: Notify owner (ntfy)
        run: |
          if [ -s out/notify.txt ]; then
            curl -sS -H "Title: ValueTally admin: ticker additions" -H "Tags: heavy_plus_sign" \
                 -H "Click: https://valuetally.com/" \
                 -d "$(cat out/notify.txt)" https://ntfy.sh/harris-stockdash-3cb22f88
          fi
